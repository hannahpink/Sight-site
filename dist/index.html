<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fffefa"><title>시선:차</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><a class="brand" href="#top">시선:차</a><nav><a href="#rooms">여행방</a><button class="login-button">Google 로그인</button><button class="profile-button" hidden>내 페이지</button><button class="notice-button" hidden aria-label="참여 요청 알림">알림 <span class="notice-count" hidden>0</span></button></nav></header>
<main id="top"><section class="landing"><div class="doodle doodle-flower">✳</div><div class="doodle doodle-line">⌁</div><div class="landing-copy"><p class="eyebrow">SAME PLACE : DIFFERENT VIEW</p><h1>시선:차</h1><p class="tagline">같은 장소, 다른 시선</p><div class="landing-actions"><button class="primary-button" data-action="join">참여 코드 입력</button><button class="line-button" data-action="create">여행방 만들기</button></div></div><img class="vase-views" src="assets/siseoncha/vase-views.png" alt="꽃병을 서로 다르게 바라본 네 가지 손그림"></section>
<section id="rooms" class="rooms"><div class="section-title"><span class="section-number">01</span><h2>여행방</h2><button class="sort-button">최신순 <span>⌄</span></button></div><div class="sort-menu" hidden><button data-sort="new">최신순</button><button data-sort="old">오래된 순</button></div><div class="room-list" aria-live="polite"><p class="empty-rooms">로그인하면 참여 중인 여행방이 보여요.</p></div></section></main>
<section class="room-view" id="room-view" hidden><div class="room-view-head"><button class="back-button" data-action="back-rooms">← 여행방</button><h2 class="room-view-title"></h2></div><div class="scene-toolbar"><button class="scene-tab active">장면</button><button class="sort-scene-button">최신순 <span>⌄</span></button><div class="scene-sort-menu" hidden><button data-scene-sort="new">최신순</button><button data-scene-sort="old">오래된 순</button></div><button class="scene-add-button">장면 추가</button></div><div class="scene-create-form" hidden><input class="scene-title-input" placeholder="장면 이름" aria-label="장면 이름"><button class="scene-create-submit">추가</button></div><div class="scene-picker"></div><div class="scene-list" hidden><div class="detail-toolbar"><button class="detail-upload-button" data-action="upload">사진·영상 추가</button></div><article class="scene-card"><div class="scene-heading"><div><p class="scene-date"></p><h3></h3></div><div class="scene-controls"><button class="visibility-button" data-target="names">이름</button><button class="visibility-button" data-target="reactions">반응</button><button class="layout-button">정사각형 <span>⌄</span></button></div></div><div class="layout-menu" hidden><button>정사각형</button><button>세로형</button><button>가로형</button></div><div class="photo-grid square-grid"></div><div class="comments"><div class="comment-list"></div><div class="comment-form"><input placeholder="이 장면에 댓글 남기기" aria-label="이 장면에 댓글 남기기"><button>남기기</button></div></div></article></div></section>
<div class="modal" id="join-modal" hidden><div class="modal-panel"><button class="modal-close">×</button><p class="eyebrow">JOIN A ROOM</p><h2>참여 코드</h2><input id="join-code" maxlength="6" placeholder="AB12CD" aria-label="참여 코드"><button class="primary-button" id="join-submit">참여 요청 보내기</button><p class="form-message" id="join-message" role="status"></p></div></div><div class="modal" id="create-modal" hidden><div class="modal-panel"><button class="modal-close">×</button><p class="eyebrow">MAKE A ROOM</p><h2>여행방 만들기</h2><input id="room-name" maxlength="80" placeholder="여행방 이름" aria-label="여행방 이름"><button class="primary-button" id="create-submit">만들기</button><p class="form-message" id="create-message" role="status"></p></div></div><div class="modal" id="profile-modal" hidden><div class="modal-panel"><button class="modal-close">×</button><p class="eyebrow">MY PAGE</p><h2>내 페이지</h2><p class="profile-email"></p><button class="line-button" id="signout-submit">로그아웃</button></div></div><div class="modal" id="notice-modal" hidden><div class="modal-panel"><button class="modal-close">×</button><p class="eyebrow">NOTIFICATIONS</p><h2>참여 요청</h2><div class="notice-list"><p>새로운 참여 요청이 없습니다.</p></div></div></div><footer><span>시선:차</span><span>같은 장소, 다른 시선</span><span>2026</span></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script src="script.js" defer></script></body></html>
